<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Manage Accounts</title>
  <style>
    :root {
      --bg: #080c14;
      --card-bg: #0f172a;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }

    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    
    #loginOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(8, 12, 20, 0.95); display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .login-box { background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; }
    
    .form-group { margin-bottom: 15px; text-align: left; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 5px; }
    input, textarea { width: 100%; padding: 10px; background: #182238; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.95rem; }
    input:focus, textarea:focus { outline: 1px solid var(--primary); }

    button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: 0.2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-secondary { background: #334155; color: #fff; }
    
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .account-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .card-img { width: 100%; height: 160px; object-fit: cover; background: #1e293b; }
    .card-content { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .badge { display: inline-block; background: #eab308; color: #000; font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-bottom: 8px; text-transform: uppercase; }
    .card-actions { display: flex; gap: 8px; margin-top: 15px; }

    .form-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 30px; }
    .help-text { font-size: 0.75rem; color: var(--muted); margin-top: 3px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LOGIN MODAL -->
  <div id="loginOverlay">
    <div class="login-box">
      <h2 style="margin-bottom: 15px;">Admin Login</h2>
      <div class="form-group">
        <label>Enter Secret Key:</label>
        <input type="password" id="secretInput" placeholder="Passcode">
      </div>
      <button class="btn-primary" style="width: 100%;" onclick="login()">Login</button>
    </div>
  </div>

  <!-- DASHBOARD CONTENT -->
  <div class="container hidden" id="dashboard">
    <header>
      <h1>Account Cards Manager</h1>
      <button class="btn-secondary" onclick="logout()">Logout</button>
    </header>

    <!-- CREATE / EDIT FORM -->
    <div class="form-card">
      <h3 id="formTitle">Add New Account Card</h3>
      <input type="hidden" id="cardId">
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
        <div class="form-group">
          <label>Account Title / Name</label>
          <input type="text" id="title" placeholder="e.g. Brezplug">
        </div>
        <div class="form-group">
          <label>Subtext / Stats</label>
          <input type="text" id="subtext" placeholder="e.g. 375.5k Subscribers • 20 Yrs Old • Denmark">
        </div>
        <div class="form-group">
          <label>Listing Price ($)</label>
          <input type="text" id="price" placeholder="e.g. $21,900">
        </div>
        <div class="form-group">
          <label>Badge Tag (Optional)</label>
          <input type="text" id="badge" placeholder="e.g. HIGH REVENUE">
        </div>
      </div>
      
      <!-- MULTIPLE SLIDESHOW IMAGES -->
      <div class="form-group">
        <label>Slideshow Image URLs (Separated by Commas)</label>
        <textarea id="imageUrl" rows="3" placeholder="https://site.com/img1.png, https://site.com/img2.png, https://site.com/img3.png"></textarea>
        <p class="help-text">Tip: Add multiple image links separated by commas to display a gallery/slideshow for this account.</p>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn-primary" onclick="saveCard()">Save Account</button>
        <button class="btn-secondary hidden" id="cancelBtn" onclick="resetForm()">Cancel</button>
      </div>
    </div>

    <!-- CURRENT ACCOUNTS LIST -->
    <h2>Active Account Listings</h2>
    <div class="card-grid" id="accountsList"></div>
  </div>

  <script>
    const BACKEND_URL = "https://handlehub-backend.onrender.com";
    let adminSecret = sessionStorage.getItem("adminSecret") || "";

    if (adminSecret) {
      showDashboard();
    }

    function login() {
      const input = document.getElementById("secretInput").value;
      if (!input) return alert("Please enter your admin secret passcode.");
      adminSecret = input;
      sessionStorage.setItem("adminSecret", adminSecret);
      showDashboard();
    }

    function logout() {
      sessionStorage.removeItem("adminSecret");
      location.reload();
    }

    function showDashboard() {
      document.getElementById("loginOverlay").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");
      fetchCards();
    }

    async function fetchCards() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/products`);
        const data = await res.json();
        
        const container = document.getElementById("accountsList");
        if (!data.success || !data.products.length) {
          container.innerHTML = "<p style='color: var(--muted); grid-column: 1/-1;'>No accounts added yet.</p>";
          return;
        }

        container.innerHTML = data.products.map(card => {
          // Get first image for preview
          const images = (card.image_url || '').split(',').map(url => url.trim());
          const previewImg = images[0] || 'https://via.placeholder.com/300x160';
          const imgCount = images.filter(Boolean).length;

          return `
            <div class="account-card">
              <img src="${previewImg}" class="card-img" alt="preview">
              <div class="card-content">
                <div>
                  ${card.badge ? `<span class="badge">${card.badge}</span>` : ''}
                  <h4>${card.title}</h4>
                  <p style="color: var(--muted); font-size: 0.85rem; margin: 5px 0;">${card.subtext}</p>
                  <p style="color: var(--success); font-weight: bold; margin-top: 5px;">${card.price}</p>
                  <p style="color: var(--muted); font-size: 0.75rem; margin-top: 4px;">🖼️ ${imgCount} Slideshow Image(s)</p>
                </div>
                <div class="card-actions">
                  <button class="btn-secondary" style="flex:1;" onclick='editCard(${JSON.stringify(card)})'>Edit</button>
                  <button class="btn-danger" style="flex:1;" onclick="deleteCard(${card.id})">Delete</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        alert("Error loading accounts from backend.");
      }
    }

    async function saveCard() {
      const payload = {
        id: document.getElementById("cardId").value || null,
        title: document.getElementById("title").value,
        subtext: document.getElementById("subtext").value,
        price: document.getElementById("price").value,
        badge: document.getElementById("badge").value,
        image_url: document.getElementById("imageUrl").value
      };

      if (!payload.title || !payload.price) {
        return alert("Title and Price are required.");
      }

      const res = await fetch(`${BACKEND_URL}/api/admin/products`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-admin-secret": adminSecret
        },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (data.success) {
        alert("Saved successfully!");
        resetForm();
        fetchCards();
      } else {
        alert("Error: " + data.message);
      }
    }

    function editCard(card) {
      document.getElementById("formTitle").innerText = "Edit Account Card";
      document.getElementById("cardId").value = card.id;
      document.getElementById("title").value = card.title;
      document.getElementById("subtext").value = card.subtext;
      document.getElementById("price").value = card.price;
      document.getElementById("badge").value = card.badge || "";
      document.getElementById("imageUrl").value = card.image_url || "";
      document.getElementById("cancelBtn").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById("formTitle").innerText = "Add New Account Card";
      document.getElementById("cardId").value = "";
      document.getElementById("title").value = "";
      document.getElementById("subtext").value = "";
      document.getElementById("price").value = "";
      document.getElementById("badge").value = "";
      document.getElementById("imageUrl").value = "";
      document.getElementById("cancelBtn").classList.add("hidden");
    }

    async function deleteCard(id) {
      if (!confirm("Are you sure you want to delete this account card?")) return;

      const res = await fetch(`${BACKEND_URL}/api/admin/products/${id}`, {
        method: "DELETE",
        headers: {
          "x-admin-secret": adminSecret
        }
      });

      const data = await res.json();
      if (data.success) {
        fetchCards();
      } else {
        alert("Error deleting: " + data.message);
      }
    }
  </script>
</body>
</html>
